<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag is installed by /tracking.js using the Ads account/tag ID
         from /api/config. The "Deposit Secured" conversion action in Google Ads
         is page-load based, so it fires automatically once the tag is present.
         Do NOT add a hardcoded gtag snippet or manual conversion event here:
         the old hardcoded snippet pointed at the retired tag and silently
         sent deposit conversions to the wrong destination. -->
    <script src="/tracking.js" type="module"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Received - Sixth &amp; 14th</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="centered-page">
      <section class="confirmation-card">
        <img class="confirmation-image" src="/park-slope-6av-14st.webp" alt="Illustrated Sixth Avenue and 14th Street icon">
        <h1>Payment received</h1>
        <p>Your payment was received securely. The reservation status will update as soon as Stripe confirmation is processed.</p>
        <a class="primary-button" href="/">Back to booking</a>
      </section>
    </main>
  </body>
</html>
