services:
  - type: web
    name: sixth14th-booking-staging
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: sixth14th-booking-staging-data
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/storage
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://book-staging.sixth14th.com
      - key: STAGING_LABEL
        value: Sixth 14th private staging
      - key: STAGING_USERNAME
        value: marc
      - key: STAGING_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LODGIFY_API_KEY
        sync: false
      - key: LODGIFY_ICAL_URL
        sync: false
      - key: LODGIFY_PROPERTY_ID
        value: 507939
      - key: LODGIFY_ROOM_TYPE_ID
        value: 574322
      - key: PAYMENT_HOLD_MINUTES
        value: 30
      - key: CRON_SECRET
        sync: false
      - key: OWNER_NOTIFY_ENABLED
        value: true
      - key: OWNER_NOTIFY_EMAIL
        value: marc@lucasand.co
      - key: GOOGLE_ADS_ID
        value: AW-994349610
      - key: GOOGLE_ADS_CONVERSION_LABEL
        sync: false
      - key: TRACKING_DEBUG
        value: false
