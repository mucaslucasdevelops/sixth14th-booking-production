services:
  - type: web
    name: sixth14th-booking-staging
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: sixth14th-booking-staging-data
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/storage
      - key: PUBLIC_BASE_URL
        value: https://book-staging.sixth14th.com
      - key: STAGING_LABEL
        value: Sixth 14th private staging
      - key: STAGING_USERNAME
        value: marc
      - key: STAGING_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LODGIFY_API_KEY
        sync: false
      - key: PAYMENT_HOLD_MINUTES
        value: 30
